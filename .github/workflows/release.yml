name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/NikkeChecker.csproj -c Release -nologo

      - uses: actions/upload-artifact@v4
        with:
          name: NikkeChecker
          path: src/bin/Release/net48/NikkeChecker.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "src/bin/Release/net48/NikkeChecker.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $notes = "NIKKE PC 런처 감염 점검 도구 ${{ github.ref_name }}`n`n``NikkeChecker.exe`` 를 내려받아 실행하세요. (Windows 10/11, 설치 불필요)`n`nSHA-256: ``$hash``"
          gh release create "${{ github.ref_name }}" $exe --title "${{ github.ref_name }}" --notes $notes
