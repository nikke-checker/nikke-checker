name: Release

# main 에 푸시하면 src/NikkeChecker.csproj 의 <Version> 으로 태그(v<Version>)를 정하고,
# 그 릴리스가 아직 없을 때만 Linux 러너에서 .NET Framework 4.8 exe 를 빌드해 릴리스를 만든다.
# 새 버전을 배포하려면 <Version> 만 올려서 main 에 푸시하면 된다. v* 태그를 푸시해도 동작한다.
# (net48 참조 어셈블리 패키지로 빌드하므로 Windows 러너가 필요 없음)
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(grep -oP '(?<=<Version>)[^<]+' src/NikkeChecker.csproj)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG 릴리스가 이미 있어 건너뜁니다. 새로 배포하려면 csproj 의 <Version> 을 올리세요."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "릴리스 태그: $TAG"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          dotnet-version: '8.0.x'

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        run: dotnet build src/NikkeChecker.csproj -c Release -nologo

      - name: Checksum
        if: steps.tag.outputs.skip != 'true'
        id: sum
        run: |
          cp src/bin/Release/net48/NikkeChecker.exe NikkeChecker.exe
          echo "sha256=$(sha256sum NikkeChecker.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.tag.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: NikkeChecker.exe

      - uses: actions/upload-artifact@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          name: NikkeChecker
          path: NikkeChecker.exe

      - name: Create release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA256: ${{ steps.sum.outputs.sha256 }}
        run: |
          cat > notes.md <<EOF
          NIKKE PC 런처 감염 점검 도구 $TAG

          \`NikkeChecker.exe\` 를 내려받아 실행하세요. (Windows 10/11, 설치 불필요)

          SHA-256: \`$SHA256\`

          ### 빌드 출처 검증
          이 exe 는 공개 소스에서 GitHub Actions 로 빌드되었고 빌드 출처 증명(artifact attestation)이 붙어 있습니다.
          GitHub CLI 로 이 리포지토리의 Actions 가 빌드한 파일인지 확인할 수 있습니다.

          \`\`\`
          gh attestation verify NikkeChecker.exe --repo nikke-checker/nikke-checker
          \`\`\`
          EOF
          # 태그가 없으면 실행한 커밋(GITHUB_SHA)에 새로 만든다.
          gh release create "$TAG" NikkeChecker.exe --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
