name: Release

# v* 태그를 푸시하면 Linux 러너에서 .NET Framework 4.8 exe 를 빌드해 릴리스에 첨부한다.
# (net48 참조 어셈블리 패키지로 빌드하므로 Windows 러너가 필요 없음)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/NikkeChecker.csproj -c Release -nologo

      - name: Checksum
        id: sum
        run: |
          cp src/bin/Release/net48/NikkeChecker.exe NikkeChecker.exe
          echo "sha256=$(sha256sum NikkeChecker.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: NikkeChecker
          path: NikkeChecker.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.sum.outputs.sha256 }}
        run: |
          printf 'NIKKE PC 런처 감염 점검 도구 %s\n\n`NikkeChecker.exe` 를 내려받아 실행하세요. (Windows 10/11, 설치 불필요)\n\nSHA-256: `%s`\n' "$TAG" "$SHA256" > notes.md
          gh release create "$TAG" NikkeChecker.exe --title "$TAG" --notes-file notes.md
